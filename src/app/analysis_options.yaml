include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Feeding and pairing run through futures; one dropped silently hides
    # a failure the owner must see.
    unawaited_futures: error
  exclude:
    - build/**
    - android/**
    - rust_builder/**
    # Generated by flutter_rust_bridge and freezed; regenerated, never edited.
    - lib/src/rust/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
