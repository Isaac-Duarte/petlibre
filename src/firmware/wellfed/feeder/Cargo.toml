[package]
license.workspace = true
name = "wellfed-fw-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 product firmware on the Wellfed SDK: the panel and its child lock (FP11) so far"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4"]

[dependencies]
wellfed-sdk.workspace = true
wellfed-feeder.workspace = true

[lints]
workspace = true

# What wellfed-build reads: no startup policies (nothing here moves the
# motor or runs the emitters).
[package.metadata.wellfed]
devices = ["plaf103"]
