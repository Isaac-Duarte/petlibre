<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feeder Bench</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>Feeder bench</h1>
    <span class="sub">Read-only view of <code>wellfed-bench</code>. It never touches the relays or the UART.</span>
  </div>
  <div id="health" class="health" aria-live="polite"><span class="pill">Checking ports…</span></div>
</header>
<main>
  <section id="script"></section>
  <section id="now"></section>
  <div class="pair">
    <section class="card log-card">
      <div class="row">
        <h2>Live log <span class="muted" id="log-meta"></span></h2>
        <div class="controls">
          <input id="filter" type="search" placeholder="Filter" aria-label="Filter log lines">
          <label><input id="follow" type="checkbox" checked> Follow</label>
          <button id="copy-log" type="button">Copy</button>
        </div>
      </div>
      <pre id="log" class="log" tabindex="0" data-empty="Waiting for output…"></pre>
    </section>
    <section id="rx" class="card rx-card"><h2>Latest RX log</h2><pre class="rx" data-empty="No capture yet."></pre></section>
  </div>
  <div class="pair lists">
    <section class="card">
      <div class="row"><h2>Sessions <span class="muted" id="sessions-meta"></span></h2><button type="button" id="sessions-more" hidden></button></div>
      <div id="session"></div>
      <div id="sessions" class="scroll"><div class="empty">Loading sessions…</div></div>
    </section>
    <section class="card">
      <div class="row"><h2>Recent commands <span class="muted" id="history-meta"></span></h2><button type="button" id="history-more" hidden></button></div>
      <div id="history" class="scroll"><div class="empty">No commands recorded yet.</div></div>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
