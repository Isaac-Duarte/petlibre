[package]
license.workspace = true
name = "petlibre-sdk-c"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The KM0 archive and the firmware panic handler"
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The KM0 archive: the routines both cores link (target builds from
# petlibre-build). KM4 archives are built from the firmware crate, which links
# this crate through petlibre-sdk.
km0 = ["dep:petlibre-hal-common", "petlibre-hal-common/km0"]
# KM4: the panic handler requests stopped outputs before halting.
km4 = ["dep:petlibre-amebad-sys", "petlibre-amebad-sys/km4"]

[dependencies]
petlibre-amebad-sys = { workspace = true, optional = true }
petlibre-hal-common = { workspace = true, optional = true }

[lints]
workspace = true
