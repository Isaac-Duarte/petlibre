[package]
license.workspace = true
name = "wellfed-fw-adc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 bring-up firmware on the Wellfed SDK: the FW14 power-input probe, read-only"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4", "wellfed-probes/km4"]

[dependencies]
wellfed-sdk.workspace = true
wellfed-probes.workspace = true

[lints]
workspace = true

# What wellfed-build reads: the ADC probe's startup policy, which the
# startup audit checks against the image's markers and `wellfed-audit adc`
# reads to parse the samples.
[package.metadata.wellfed]
devices = ["plaf103"]
policies = { adc = "fw14-adc-v2" }
