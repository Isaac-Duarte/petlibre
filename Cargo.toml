[workspace]
members = ["crates/*"]
# `cargo build`/`cargo run` at the root mean the local server, as before the move.
default-members = ["crates/petlibre-local"]
resolver = "3"

# Firmware crates permit audited `unsafe` at the C ABI and MMIO boundaries only.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

# Firmware staticlibs: size-optimized, one LTO object per core so the linker
# script can retain the RAM park section; unwinding is never generated.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"

# The stock-image probe is checked store-by-store under emulation; the smallest
# code keeps register saves to a single push.
[profile.firmware.package.petlibre-probe]
opt-level = "z"
