[package]
license.workspace = true
name = "wellfed-amebad-sys"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Pinned AmebaD SDK calls, with a deterministic host fake"
publish.workspace = true
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
# Requires WELLFED_SDK_DIR and WELLFED_NEWLIB_INCLUDE; set by wellfed-build.
sdk = ["dep:bindgen"]
# Select the core; only KM4 calls the SDK.
km0 = []
km4 = []
# The BLE peripheral's calls; only a firmware that declares
# `bluetooth = true` links `wellfed_ble.c`, which defines them.
bluetooth = []
# Copy every logged line into the RAM log tail (`LOG_TAIL`) as well, for
# the device API to stream. Host builds always keep the tail.
log-tail = []

[dependencies]
wellfed-board-plaf103.workspace = true
wellfed-core.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true

[build-dependencies]
bindgen = { version = "0.72.1", optional = true, default-features = false, features = ["runtime"] }

[lints]
workspace = true
