[package]
license.workspace = true
name = "wellfed-sdk-c"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Wellfed SDK's C ABI, the KM0 archive and the firmware panic handler"
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The KM0 archive: the routines both cores link (target builds from
# wellfed-build). KM4 archives are built from the firmware crate, which links
# this crate through wellfed-sdk.
km0 = ["dep:wellfed-hal-common", "wellfed-hal-common/km0"]
# KM4: the panic handler requests stopped outputs before halting.
km4 = ["dep:wellfed-amebad-sys", "wellfed-amebad-sys/km4"]

[dependencies]
wellfed-core.workspace = true
wellfed-amebad-sys = { workspace = true, optional = true }
wellfed-hal-common = { workspace = true, optional = true }

[dev-dependencies]
wellfed-testkit.workspace = true

[lints]
workspace = true
