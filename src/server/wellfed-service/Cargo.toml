[package]
license.workspace = true
name = "wellfed-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The owner's server domain logic: users, adopted feeders, the commands sent to them and the live stream's hub. No HTTP, no SQL, no feeder sessions"
