[package]
license.workspace = true
name = "petlibre-firstboot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 KM4 first-boot image: the diagnostic application entry and its bench probes"
publish.workspace = true

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-amebad/km4", "petlibre-amebad/sdk"]
# FW16 first supervised motor pulse instead of the FW13 optics probe. Only
# `petlibre-build plaf103-firstboot --motion-probe` sets it; never a default.
fw16-pulse = []
# FW11 trial test: a candidate that stops feeding the watchdog right after
# startup, before it could confirm. Only `petlibre-build plaf103-firstboot --trial-reset` sets it.
fw11-reset = []
# FW11 trial test: a candidate whose startup fails on a determined error.
# Only `petlibre-build plaf103-firstboot --trial-fail` sets it.
fw11-fail = []
# Speaker variant: the normal image plus a signed network audio stream
# (petlibre-amebad stream.rs). Only `petlibre-build plaf103-firstboot --speaker` sets it.
speaker = []

[dependencies]
petlibre-amebad.workspace = true
petlibre-core.workspace = true

# The workspace lints, plus a SAFETY comment on every `unsafe` block: Cargo
# cannot extend `workspace = true`, and the host crates do not opt in yet.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
