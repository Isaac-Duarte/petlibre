[package]
license.workspace = true
name = "petlibre-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "C ABI for linking the Rust replacement firmware into the AmebaD SDK"
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Link the AmebaD ports for one core (target builds from firmware/tools/build.py).
km0 = ["dep:petlibre-amebad", "petlibre-amebad/km0"]
km4 = ["dep:petlibre-amebad", "petlibre-amebad/km4", "petlibre-amebad/sdk"]
fw16-pulse = ["km4", "petlibre-amebad/fw16-pulse"]
fw11-reset = ["km4", "petlibre-amebad/fw11-reset"]

[dependencies]
petlibre-core.workspace = true
petlibre-amebad = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
petlibre-testkit.workspace = true
