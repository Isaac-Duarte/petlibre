[package]
license = "MIT"
name = "petlibre-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Offline audits of PLAF103 evidence: startup captures, FW14 ADC, FW30 driver transients and full-flash comparisons"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
petlibre-flash = { version = "0.1.0", path = "../petlibre-flash" }
petlibre-formats.workspace = true
regex = "1"
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
