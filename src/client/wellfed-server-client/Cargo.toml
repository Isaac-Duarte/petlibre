[package]
license.workspace = true
name = "wellfed-server-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A typed async client of the owner's server HTTP API, the event stream included: the CLI and the server's tests"
publish.workspace = true

[dependencies]
futures-util.workspace = true
wellfed-api.workspace = true
# rustls with its own provider: a feature without one would make every
# reqwest client in the workspace (wellfed-stock's too) panic on build.
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true
