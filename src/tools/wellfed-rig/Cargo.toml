[package]
license.workspace = true
name = "wellfed-rig"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The PLAF103 bench's rig: feeder power, the loader strap, chained wellfed-flash sessions, the over-the-air loop and the device API, which the bench's commands and the integration suite share"
publish.workspace = true

[dependencies]
clap.workspace = true
jiff = "0.2.38"
mdns-sd = "0.21.6"
wellfed-client.workspace = true
wellfed-core.workspace = true
wellfed-formats = { workspace = true, features = ["clap"] }
wellfed-stock-api = { path = "../wellfed-stock-api" }
wellfed-model.workspace = true
wellfed-proto.workspace = true
wellfed-relay = { path = "../wellfed-relay" }
wellfed-session.workspace = true
# Signs offers; `--build` runs the wellfed-build binary as a child process.
wellfed-signing.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
ed25519-dalek = "2"
# Freezes the pinned stock review for one ignored test.
wellfed-build = { path = "../wellfed-build" }
# Device::install's push, faults included, against the simulator over TCP.
wellfed-feeder-sim = { path = "../wellfed-feeder-sim", features = ["harness"] }
wellfed-image = { workspace = true, features = ["fixtures"] }
wellfed-relay = { path = "../wellfed-relay", features = ["fake"] }
sha2 = "0.10"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "time"] }

[lints]
workspace = true
