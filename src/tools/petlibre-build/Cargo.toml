[package]
license.workspace = true
name = "petlibre-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local AmebaD firmware builds: pinned SDK and toolchain, source-bound identity, SDK overlays and the linked-image audits"
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
