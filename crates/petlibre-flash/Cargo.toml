[package]
license = "MIT"
name = "petlibre-flash"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "UART flash reads, region-scoped updates and stock recovery for the PLAF103 research unit"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.11"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
