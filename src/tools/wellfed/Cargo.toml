[package]
license.workspace = true
name = "wellfed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The owner's command line: BLE setup of a feeder, and the device API as it lands"
publish.workspace = true

[dependencies]
anyhow.workspace = true
# The bench server's socket, when one holds the feeder's session.
bytes = "1"
http-body-util.workspace = true
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
clap.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = "0.2.38"
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-formats = { workspace = true, features = ["device"] }
wellfed-model.workspace = true
wellfed-proto.workspace = true
wellfed-server-client.workspace = true
wellfed-session.workspace = true
wellfed-signing.workspace = true
wellfed-stock-api.workspace = true
rustix = { version = "1", features = ["process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
wellfed-server-testkit.workspace = true
# `wellfed status` through a stand-in for the bench server's device routes,
# in front of a simulated feeder.
axum.workspace = true
wellfed-feeder-sim = { path = "../wellfed-feeder-sim", features = ["harness"] }
tempfile.workspace = true

[lints]
workspace = true
