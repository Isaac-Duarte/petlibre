wellfed-api.workspace = true
wellfed-formats.workspace = true
wellfed-mirror.workspace = true
wellfed-model.workspace = true
wellfed-releases.workspace = true
wellfed-store.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
wellfed-server-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
