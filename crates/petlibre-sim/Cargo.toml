[package]
license = "MIT"
name = "petlibre-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Virtual feeder worker: the real owner on the fake SDK with a file-backed journal"
publish = false

[[bin]]
name = "virtual-feeder-worker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
petlibre-amebad = { path = "../petlibre-amebad" }
petlibre-core = { path = "../petlibre-core" }
petlibre-testkit = { path = "../petlibre-testkit" }
serde_json = "1.0.154"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2.0.21"

[lints]
workspace = true
