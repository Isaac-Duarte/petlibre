[package]
license.workspace = true
name = "wellfed-install"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The install from stock 1.1.15 to Wellfed, driven over tokio: stock's server in-process, pairing, the backup, the promotion and the plans' import, with prompts, Bluetooth, discovery and progress from the platform"
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-formats.workspace = true
wellfed-model.workspace = true
wellfed-proto.workspace = true
wellfed-session.workspace = true
wellfed-signing.workspace = true
# Stock's broker, server and image server, run in this process; without
# the bench host's routing and its binary.
wellfed-stock = { workspace = true, default-features = false }

[features]
# The bench host's side of stock's server: a captured device, which records
# no address, is found on the hotspot by its MAC. The CLI enables it; an app
# does not, and needs the address the enrollment recorded.
bench = ["wellfed-stock/bench"]

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
wellfed-feeder-sim = { workspace = true, features = ["harness"] }

[lints]
workspace = true
