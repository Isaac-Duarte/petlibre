[workspace]
members = [
    "src/sdk/*",
    "src/product/*",
    "src/client/*",
    "src/server/*",
    "src/tools/wellfed",
    "src/tools/wellfed-*",
    "src/tools/xtask",
    "src/firmware/wellfed/*", "src/client/wellfed-client",
]
# The cargo-fuzz targets build on nightly-only sanitizer flags, so they keep
# their own workspace and lockfile (`cargo xtask fuzz`).
exclude = ["src/fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
wellfed-hal = { path = "src/sdk/wellfed-hal" }
wellfed-hal-common = { path = "src/sdk/wellfed-hal-common" }
wellfed-amebad-sys = { path = "src/sdk/wellfed-amebad-sys" }
wellfed-board-plaf103 = { path = "src/sdk/wellfed-board-plaf103" }
wellfed-core = { path = "src/sdk/wellfed-core" }
wellfed-proto = { path = "src/product/wellfed-proto" }
wellfed-session = { path = "src/sdk/wellfed-session" }
wellfed-probes = { path = "src/sdk/wellfed-probes" }
wellfed-sdk = { path = "src/sdk/wellfed-sdk" }
wellfed-sdk-c = { path = "src/sdk/wellfed-sdk-c" }
wellfed-feeder = { path = "src/product/wellfed-feeder" }
wellfed-feeder-runtime = { path = "src/product/wellfed-feeder-runtime" }
wellfed-client = { path = "src/client/wellfed-client" }
wellfed-model = { path = "src/client/wellfed-model" }
wellfed-connect = { path = "src/client/wellfed-connect" }
wellfed-feeder-sim = { path = "src/tools/wellfed-feeder-sim" }
wellfed-api = { path = "src/server/wellfed-api" }
wellfed-store = { path = "src/server/wellfed-store" }
wellfed-service = { path = "src/server/wellfed-service" }
wellfed-formats = { path = "src/tools/wellfed-formats" }
wellfed-stock = { path = "src/tools/wellfed-stock" }
wellfed-emu = { path = "src/tools/wellfed-emu" }
wellfed-testkit = { path = "src/sdk/wellfed-testkit" }
wellfed-sim = { path = "src/sdk/wellfed-sim" }
# Host tools.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
# Bounded property tests of the network parsers (dev-dependency only). No
# fork or timeout features: properties run in-process under nextest.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = "1.28.0"
# The owner's server (src/server).
jiff = "0.2.38"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
utoipa = "6.0.0"
# Firmware targets.
cortex-m = "0.7.7"

# Every crate inherits these, tests included. Host crates also forbid
# `unsafe` at their crate roots; firmware crates permit audited `unsafe` at
# the C ABI and MMIO boundaries only, each block with a SAFETY comment. The
# production-only lints (no unwrap, no narrowing `as`, …) run from
# `make check-rust` over libraries and binaries, so tests stay free to unwrap.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

# Firmware staticlibs: size-optimized, one LTO object per core so the linker
# script can retain the RAM park section; unwinding is never generated.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
