[package]
license.workspace = true
name = "wellfed-stock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What stock PLAF103 1.1.15 speaks: its MQTT protocol and broker, the setup frame and the install-trial ledger"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
rumqttc = { version = "0.25.1", default-features = false }
mqtt5 = { version = "0.48.1", default-features = false, features = ["broker"] }
serde.workspace = true
serde_json.workspace = true
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1.44"
uuid = { workspace = true, features = ["v4", "serde"] }
wellfed-core.workspace = true
wellfed-formats.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
