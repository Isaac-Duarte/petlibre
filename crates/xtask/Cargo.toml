[package]
license = "MIT"
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Repository maintenance tasks: documentation links, tool dependencies, portability and transport isolation"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"

[dev-dependencies]
tempfile = "3.27.0"
