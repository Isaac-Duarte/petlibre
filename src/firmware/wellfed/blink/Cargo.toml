[package]
license.workspace = true
name = "wellfed-fw-blink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental minimal PLAF103 firmware on the Wellfed SDK: blinks the connection indicator"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4"]

[dependencies]
wellfed-sdk.workspace = true

[lints]
workspace = true

# What wellfed-build reads (see the firmware guide): blink builds for
# the PLAF103, with no startup policies of its own and no variants.
[package.metadata.wellfed]
devices = ["plaf103"]
