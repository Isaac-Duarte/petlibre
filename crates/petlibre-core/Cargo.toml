[package]
license.workspace = true
name = "petlibre-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Hardware-independent PLAF103 feeding, sensing, journal and flash-lease logic"
publish.workspace = true

# The workspace lints, plus a SAFETY comment on every `unsafe` block: Cargo
# cannot extend `workspace = true`, and the host crates do not opt in yet.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
ed25519-dalek = "2"
petlibre-testkit.workspace = true
sha2 = "0.10"

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }
