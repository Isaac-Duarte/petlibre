[package]
license.workspace = true
name = "wellfed-releases"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The server's releases: fetched from the project's GitHub releases or uploaded, verified with the feeder's own offer check, and kept in a cache in the data directory"
publish.workspace = true

[dependencies]
jiff.workspace = true
wellfed-api.workspace = true
wellfed-client.workspace = true
wellfed-model.workspace = true
# rustls with its own provider: a feature without one would make every
# reqwest client in the workspace panic on build.
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
wellfed-core.workspace = true
sha2-0-10.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }

[lints]
workspace = true
