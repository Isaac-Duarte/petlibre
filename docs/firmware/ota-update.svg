<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" aria-labelledby="ota-update-title ota-update-desc">
  <title id="ota-update-title">One update, from offer to confirmation</title>
  <desc id="ota-update-desc">A client offers a signed update to bank 1. Bank 1 answers that it is giving way, clears its own marker and restarts, so the loader boots bank 0. The client offers the update again. Bank 0 asks for the chunks, writes them into bank 1, checks the whole image and writes bank 1's marker last, then answers Activated and restarts. The new build in bank 1 boots on trial and confirms once healthy. After three unconfirmed boots, KM0 clears bank 1's marker and bank 0 boots instead.</desc>
  <defs>
    <marker id="ota-update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ota-update-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head-accent" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Who takes part -->
  <rect class="d-box" x="40" y="20" width="140" height="44" rx="8"/>
  <text x="110" y="47" text-anchor="middle" class="d-title">Client</text>
  <rect class="d-accent" x="290" y="20" width="140" height="44" rx="8"/>
  <text x="360" y="47" text-anchor="middle" class="d-title">Bank 1</text>
  <rect class="d-box" x="540" y="20" width="140" height="44" rx="8"/>
  <text x="610" y="47" text-anchor="middle" class="d-title">Bank 0</text>
  <g class="d-unknown">
    <line x1="110" y1="64" x2="110" y2="664"/>
    <line x1="360" y1="64" x2="360" y2="664"/>
    <line x1="610" y1="64" x2="610" y2="664"/>
  </g>

  <!-- Bank 1 gives way -->
  <text x="235" y="98" text-anchor="middle">Offer the signed update</text>
  <line class="d-wire-accent" x1="110" y1="108" x2="354" y2="108" marker-end="url(#ota-update-accent)"/>
  <text x="235" y="140" text-anchor="middle">GivingWay</text>
  <line class="d-wire d-dashed" x1="360" y1="150" x2="116" y2="150" marker-end="url(#ota-update-arrow)"/>
  <rect class="d-warn" x="250" y="168" width="220" height="44" rx="8"/>
  <text x="360" y="186" text-anchor="middle">Clears its own marker</text>
  <text x="360" y="203" text-anchor="middle">and restarts</text>
  <text x="485" y="236" text-anchor="middle" class="d-muted">the loader boots bank 0</text>
  <line class="d-wire d-dashed" x1="360" y1="246" x2="604" y2="246" marker-end="url(#ota-update-arrow)"/>

  <!-- Bank 0 installs -->
  <text x="360" y="284" text-anchor="middle">The same offer again</text>
  <line class="d-wire-accent" x1="110" y1="294" x2="604" y2="294" marker-end="url(#ota-update-accent)"/>
  <text x="360" y="326" text-anchor="middle">Receiving: these chunks</text>
  <line class="d-wire d-dashed" x1="610" y1="336" x2="116" y2="336" marker-end="url(#ota-update-arrow)"/>
  <text x="360" y="368" text-anchor="middle">Chunks, 512 bytes each</text>
  <line class="d-wire-accent" x1="110" y1="378" x2="604" y2="378" marker-end="url(#ota-update-accent)"/>
  <rect class="d-warn" x="480" y="396" width="226" height="62" rx="8"/>
  <text x="593" y="417" text-anchor="middle">Writes bank 1, checks the</text>
  <text x="593" y="434" text-anchor="middle">whole image's SHA-256, then</text>
  <text x="593" y="451" text-anchor="middle">writes bank 1's marker last</text>
  <text x="360" y="488" text-anchor="middle">Activated</text>
  <line class="d-wire d-dashed" x1="610" y1="498" x2="116" y2="498" marker-end="url(#ota-update-arrow)"/>
  <text x="485" y="530" text-anchor="middle" class="d-muted">restart: bank 1 wins</text>
  <line class="d-wire d-dashed" x1="610" y1="540" x2="366" y2="540" marker-end="url(#ota-update-arrow)"/>

  <!-- The trial -->
  <rect class="d-ok" x="250" y="558" width="220" height="44" rx="8"/>
  <text x="360" y="576" text-anchor="middle">New build on trial,</text>
  <text x="360" y="593" text-anchor="middle">confirms once healthy</text>
  <rect class="d-fault" x="250" y="614" width="456" height="44" rx="8"/>
  <text x="478" y="632" text-anchor="middle">Three unconfirmed boots: KM0 clears bank 1's</text>
  <text x="478" y="649" text-anchor="middle">marker, and the loader boots bank 0 again</text>
</svg>
