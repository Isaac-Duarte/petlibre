[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# KM0 (Cortex-M23, armv8-m.base) and KM4 (Cortex-M33, armv8-m.main, FPv5-SP hard float);
# thumbv7em-none-eabi builds the soft-float Cortex-M4 stock-image probe.
targets = ["thumbv8m.base-none-eabi", "thumbv8m.main-none-eabihf", "thumbv7em-none-eabi"]
