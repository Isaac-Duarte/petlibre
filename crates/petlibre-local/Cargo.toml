[package]
name = "petlibre-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Local stock-firmware control for an owned Petlibro PLAF103"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
rumqttc = { version = "0.25.1", default-features = false }
mqtt5 = { version = "0.48.1", default-features = false, features = ["broker"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
petlibre-core = { version = "0.1.0", path = "../petlibre-core" }
ed25519-dalek = "2"

[dev-dependencies]
petlibre-core = { path = "../petlibre-core" }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "warn"
