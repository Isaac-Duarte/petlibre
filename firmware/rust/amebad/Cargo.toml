[package]
license = "MIT"
name = "wellfed-amebad"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Experimental PLAF103 AmebaD board, supervision, owner and flash-park ports"
publish = false
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
sdk = ["wellfed-amebad-sdk/sdk"]
# Select the core whose MMIO map and semaphore owner encoding apply.
km0 = ["wellfed-amebad-sdk/km0"]
km4 = ["wellfed-amebad-sdk/km4"]
# FW16 first supervised motor pulse instead of the FW13 optics probe. Only
# `build.py plaf103-firstboot --motion-probe` sets it; never a default.
fw16-pulse = []
# FW11 trial test: a candidate that never confirms and lets the watchdog
# reset it after startup. Only `build.py --trial-reset` sets it.
fw11-reset = []

[dependencies]
wellfed-amebad-sdk = { path = "../amebad-sdk" }
wellfed-core = { path = "../core" }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"

[dev-dependencies]
ed25519-dalek = "2"
wellfed-testkit = { path = "../testkit" }
sha2 = "0.10"

[lints]
workspace = true
