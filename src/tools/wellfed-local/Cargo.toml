[package]
license.workspace = true
name = "wellfed-local"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The bench's local PLAF103 server: a binary over wellfed-stock for stock's broker and install trials"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
wellfed-formats.workspace = true
wellfed-stock.workspace = true

[dev-dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rumqttc = { version = "0.25.1", default-features = false }
tempfile.workspace = true

[lints]
workspace = true
