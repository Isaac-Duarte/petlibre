[package]
license.workspace = true
name = "wellfed-fw-trial"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 test firmware on the Wellfed SDK: FW11 trial images that must roll back"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4"]
# The variants declared below; only `wellfed-build --variant` sets one.
fw11-reset = []
fw11-fail = ["wellfed-sdk/fw11-fail"]

[dependencies]
wellfed-sdk.workspace = true

[lints]
workspace = true

# What wellfed-build reads: the normal image adds nothing; each variant is
# a trial image KM0 must roll back.
[package.metadata.wellfed]
devices = ["plaf103"]

[package.metadata.wellfed.variants.fw11-reset]
summary = "FW11 trial test: stops feeding the watchdog right after startup, before it could confirm"
policies = { trial = "fw11-reset-v1" }

[package.metadata.wellfed.variants.fw11-fail]
summary = "FW11 trial test: startup fails on a determined error"
policies = { trial = "fw11-fail-v1" }
