[package]
license.workspace = true
name = "wellfed-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Relay bench for the PLAF103 research unit: the bench server in the foreground, the command line that is its client, and the read-only progress page beside it"
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The operator's timers: local clock times and lengths such as `5m`.
jiff = "0.2.38"
# `serve`'s full-screen console on /dev/tty, and its keys.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29.0"
wellfed-bench-server = { path = "../wellfed-bench-server" }
wellfed-dashboard = { path = "../wellfed-dashboard", optional = true }
wellfed-formats.workspace = true
wellfed-relay = { path = "../wellfed-relay" }
wellfed-rig = { path = "../wellfed-rig" }
rustix = { version = "1", features = ["fs", "process"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# The read-only page (`serve --ui`), served by wellfed-dashboard. Build
# src/web/apps/bench/dist first (`make ui`); the page embeds it.
ui = ["dep:wellfed-dashboard", "wellfed-dashboard/ui"]
# `serve --fake-board`: a scripted relay board, so the page's end-to-end
# tests run the real server with no hardware. `make check-web` builds it.
fake-board = ["wellfed-relay/fake"]

[lints]
workspace = true
