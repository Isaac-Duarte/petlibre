[package]
license.workspace = true
name = "wellfed-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The owner's server: mirrors each feeder's history and serves the HTTP API"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "with-rejection"] }
clap.workspace = true
futures-util = "0.3.34"
jiff.workspace = true
wellfed-api.workspace = true
wellfed-service.workspace = true
wellfed-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.20"
tower-http = { version = "0.6.11", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa.workspace = true
utoipa-axum = "0.3.0"
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-feeder-sim = { workspace = true, features = ["harness"] }
wellfed-proto.workspace = true
wellfed-session.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json", "stream"] }
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
