[package]
license.workspace = true
name = "wellfed-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental Wellfed SDK: the PLAF103 KM4 runtime every firmware runs inside, and the API firmwares build on"
publish.workspace = true

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-hal/km4", "wellfed-hal/sdk"]
# FW11 trial test: a candidate whose startup fails on a determined error.
# Only `wellfed-build plaf103-firstboot --trial-fail` sets it.
fw11-fail = []

[dependencies]
wellfed-hal.workspace = true
wellfed-core.workspace = true

[lints]
workspace = true
