[package]
license.workspace = true
name = "wellfed-fw-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 product firmware on the Wellfed SDK: the panel and its child lock, BLE setup and pairing, and the device API's measured budget"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings and the BLE peripheral,
# which the product image always links and starts only in setup mode, and
# the RAM log tail the device API streams to an owner.
km4 = [
    "wellfed-sdk/km4",
    "wellfed-feeder-runtime/km4",
    "wellfed-sdk/bluetooth",
    "wellfed-sdk/log-tail",
]
# Stream raw noise samples for the host's entropy estimate. It keeps the
# log tail: the samples are taken between prints, and the copy after each
# print (microseconds, under the scheduler suspension the print already
# holds) is dwarfed by the print itself, so it does not shape the jitter.
entropy = []
# Stall the loop twice, for the bench to watch the owner's beat lapse.
owner-stall = []
# Starve the runtime's service task once a boot, held boots included, for
# the bench to watch a reset storm hold and then halt.
held-stall = []
# Measure the loop's and a priority-4 task's scheduling gaps; feeds refused.
gap-probe = []
# Stall the loop once, 2 s into each feed's drive: 600 ms for a 1-portion
# feed, 8 s for more, for the bench to watch the motor lease and the beat.
feed-stall = []
# Make each feed's stop not take, 2 s into its drive: held 300 ms for a
# 1-portion feed, 8 s for more, for the bench to watch the stop retry and
# the watchdog.
stop-fail = ["wellfed-sdk/stop-fail"]
# A feeding owner that cannot open (its journal reads as failed, untouched):
# its trial must not confirm, and falls back to bank 0.
owner-fail = []
# Show each feed a jam, 2 s into its drive: one the first reversal frees
# for a 1-portion feed, one no reversal frees for 2, the mark input stuck
# LOW for 3.
feed-jam = ["wellfed-sdk/feed-faults"]
# Show each feed a sensor fault: the marks lost from the drive's start for
# a 1-portion feed, the outlet blocked before it starts for 2, the ADC lost
# 2 s into its drive for 3.
sensor-fault = ["wellfed-sdk/feed-faults"]
# Nothing but another build identity: installed after the feeder, it goes
# through a trial and still serves the device API.
twin = []

[dependencies]
wellfed-feeder-runtime.workspace = true
wellfed-core.workspace = true
wellfed-device-api.workspace = true
wellfed-feeder.workspace = true
wellfed-proto.workspace = true
wellfed-sdk.workspace = true
wellfed-session.workspace = true

[dev-dependencies]
wellfed-feeder = { workspace = true, features = ["conformance"] }
wellfed-client.workspace = true
wellfed-model.workspace = true
# The virtual feeder copies the feeding limits; a test holds them equal.
wellfed-sim.workspace = true

[lints]
workspace = true

# What wellfed-build reads: no startup policies (nothing moves the motor or
# runs the emitters at startup: the feeding owner holds them stopped until an
# authenticated feed request, which the bench never sends), and the BLE stack
# linked.
[package.metadata.wellfed]
devices = ["plaf103"]
bluetooth = true

[package.metadata.wellfed.variants.entropy]
summary = "Raw clock-jitter and ADC samples over UART, for the host's entropy estimate"

[package.metadata.wellfed.variants.owner-stall]
summary = "Stalls the loop 3 s at 2 minutes and 12 s at 3 minutes; at rest the feeding owner's beat allows 10 s, so the first changes nothing and the second lapses into a watchdog reset"

[package.metadata.wellfed.variants.held-stall]
summary = "A priority-3 task spins 15 s a minute into every boot past its trial, held boots included, starving the runtime's service task past the 10 s liveness window into a watchdog reset; on bank 0 the storm holds at five resets and halts for an hour at eight. A feed under way then ends in the reset and resolves uncertain"

[package.metadata.wellfed.variants.gap-probe]
summary = "Logs the scheduling gaps of the loop and of a priority-4 probe task every 10 s, with the Wi-Fi counters, for comparing them across rejoins; feeds are refused"

[package.metadata.wellfed.variants.feed-stall]
summary = "Stalls the loop once in each feed, 2 s into its drive: 600 ms for one portion (the motor lease stops the drive and the feed is recorded failed before the faulted owner resets the board), 8 s for more (the lapsed beat resets the board mid-feed and the next boot resolves the feed as uncertain)"

[package.metadata.wellfed.variants.stop-fail]
summary = "Cancels each feed 2 s into its drive with STOP writes held so the stop does not take: 300 ms for one portion (the timer retries the stop until it takes, then the feed is recorded cancelled before the faulted owner resets the board), 8 s for more (only the watchdog reset ends the drive; the hold lifts by itself after 8 s)"

[package.metadata.wellfed.variants.owner-fail]
summary = "The feeding owner never opens (its journal reads as failed, and is left untouched), so the build's trial never confirms: each trial boot stops at once and KM0 counts it, then gives way to bank 0"

[package.metadata.wellfed.variants.feed-jam]
summary = "Shows each feed a jam on the current channel, 2 s into its drive: for one portion a jam the first reversal frees (the feed completes after one reversal), for two one no reversal frees (three reversals, then failed overcurrent), for three the mark input stuck LOW (failed sensor after 4 s); the motor really turns, hopper empty"

[package.metadata.wellfed.variants.sensor-fault]
summary = "Shows each feed a sensor fault: for one portion the marks lost from the drive's start (failed no-feedback after 11 s), for two the outlet blocked before it starts (failed outlet, no motion), for three the ADC lost 2 s into its drive (failed sensor, then the owner holds the fault until a restart)"

[package.metadata.wellfed.variants.twin]
summary = "The feeder unchanged under another build identity, so the bench's drills can install a build that goes through a trial and still serves the device API"
