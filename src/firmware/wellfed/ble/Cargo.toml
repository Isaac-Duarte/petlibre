[package]
license.workspace = true
name = "wellfed-fw-ble"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 firmware on the Wellfed SDK: Bluetooth LE bring-up and Wi-Fi setup over BLE"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings and the BLE peripheral's calls.
km4 = ["wellfed-sdk/km4", "wellfed-sdk/bluetooth", "wellfed-probes/km4", "wellfed-probes/bluetooth"]

[dependencies]
wellfed-sdk.workspace = true
wellfed-probes.workspace = true

[lints]
workspace = true

# What wellfed-build reads (see the README): it builds for the
# PLAF103 and links the device's Bluetooth stack (FW34), with no startup
# policies of its own and no variants.
[package.metadata.wellfed]
devices = ["plaf103"]
bluetooth = true
