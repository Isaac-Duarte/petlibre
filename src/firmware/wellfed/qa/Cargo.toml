[package]
license.workspace = true
name = "wellfed-fw-qa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 QA firmware on the Wellfed SDK: a guided self-test of optics, power, buttons, indicators and speaker"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4", "wellfed-feeder-runtime/km4", "wellfed-probes/km4"]

[dependencies]
wellfed-feeder-runtime.workspace = true
wellfed-sdk.workspace = true
wellfed-probes.workspace = true
wellfed-core.workspace = true

[lints]
workspace = true

# What wellfed-build reads: the default firmware. Its image runs the optics
# and power probes, so it carries their startup policies (the startup audit
# checks each against the image's markers).
[package.metadata.wellfed]
devices = ["plaf103"]
policies = { optics = "fw13-optics-v2", adc = "fw14-adc-v2" }
