[package]
license.workspace = true
name = "wellfed-firstboot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 KM4 first-boot image: the diagnostic application entry and its bench probes"
publish.workspace = true

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-amebad/km4", "wellfed-amebad/sdk"]
# FW16 first supervised motor pulse instead of the FW13 optics probe. Only
# `build.py plaf103-firstboot --motion-probe` sets it; never a default.
fw16-pulse = []
# FW11 trial test: a candidate that stops feeding the watchdog right after
# startup, before it could confirm. Only `build.py --trial-reset` sets it.
fw11-reset = []
# FW11 trial test: a candidate whose startup fails on a determined error.
# Only `build.py --trial-fail` sets it.
fw11-fail = []
# Speaker variant: the normal image plus a signed network audio stream
# (wellfed-amebad stream.rs). Only `build.py --speaker` sets it.
speaker = []

[dependencies]
wellfed-amebad.workspace = true
wellfed-core.workspace = true

[lints]
workspace = true
