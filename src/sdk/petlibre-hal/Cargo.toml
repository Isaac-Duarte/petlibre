[package]
license.workspace = true
name = "petlibre-hal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 AmebaD KM4 ports: board, supervision, owner, transport and updater"
publish.workspace = true
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
sdk = ["petlibre-amebad-sys/sdk"]
# KM4 target builds; the KM0 image links only petlibre-hal-common.
km4 = ["petlibre-hal-common/km4", "petlibre-amebad-sys/km4"]
# BLE setup; needs a Bluetooth firmware's image.
bluetooth = ["petlibre-amebad-sys/bluetooth"]

[dependencies]
petlibre-hal-common.workspace = true
petlibre-amebad-sys.workspace = true
petlibre-core.workspace = true

[dev-dependencies]
ed25519-dalek = "2"
petlibre-testkit.workspace = true
sha2 = "0.10"

[lints]
workspace = true
