[package]
license.workspace = true
name = "petlibre-amebad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 AmebaD board, supervision, owner and flash-park ports"
publish.workspace = true
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
sdk = ["petlibre-amebad-sdk/sdk"]
# Select the core whose MMIO map and semaphore owner encoding apply.
km0 = ["petlibre-amebad-sdk/km0"]
km4 = ["petlibre-amebad-sdk/km4"]
# FW16 first supervised motor pulse instead of the FW13 optics probe. Only
# `build.py plaf103-firstboot --motion-probe` sets it; never a default.
fw16-pulse = []
# FW11 trial test: a candidate that never confirms and lets the watchdog
# reset it after startup. Only `build.py --trial-reset` sets it.
fw11-reset = []

[dependencies]
petlibre-amebad-sdk.workspace = true
petlibre-core.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true

[dev-dependencies]
ed25519-dalek = "2"
petlibre-testkit.workspace = true
sha2 = "0.10"

[lints]
workspace = true
