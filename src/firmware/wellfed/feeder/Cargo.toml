[package]
license.workspace = true
name = "wellfed-fw-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 product firmware on the Wellfed SDK: the panel and its child lock (FP11), and the device API's measured budget (FW44)"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings and the BLE peripheral,
# which the product image always links and starts only in setup mode.
km4 = ["wellfed-sdk/km4", "wellfed-sdk/bluetooth"]
# FW44: start BLE setup mode at boot, to measure the image with it running.
setup = []

[dependencies]
wellfed-core.workspace = true
wellfed-feeder.workspace = true
wellfed-sdk.workspace = true

[lints]
workspace = true

# What wellfed-build reads: no startup policies (nothing here moves the
# motor or runs the emitters), and the BLE stack linked.
[package.metadata.wellfed]
devices = ["plaf103"]
bluetooth = true

[package.metadata.wellfed.variants.setup]
summary = "BLE setup mode from boot, beside the panel and the budget run (FW44 measurement)"
