[package]
license.workspace = true
name = "wellfed-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Relay bench for the PLAF103 research unit: feeder power, loader strap, chained wellfed-flash sessions and a read-only progress page"
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap.workspace = true
ctrlc.workspace = true
wellfed-core.workspace = true
futures-util = { version = "0.3", default-features = false }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rustix = { version = "1", features = ["fs", "process"] }
wellfed-formats.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
