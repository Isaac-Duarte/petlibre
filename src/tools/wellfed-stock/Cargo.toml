[package]
license.workspace = true
name = "wellfed-stock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "What stock PLAF103 1.1.15 speaks (its MQTT protocol and broker, the setup frame, the image server and the install-trial ledger) and the bench's server binary over it"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap.workspace = true
rumqttc = { version = "0.25.1", default-features = false }
mqtt5 = { version = "0.48.1", default-features = false, features = ["broker"] }
serde.workspace = true
serde_json.workspace = true
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
wellfed-client.workspace = true
wellfed-core.workspace = true
wellfed-formats.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
