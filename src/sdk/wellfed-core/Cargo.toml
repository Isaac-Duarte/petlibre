[package]
license.workspace = true
name = "wellfed-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Hardware-independent PLAF103 feeding, sensing, journal and flash-lease logic"
publish.workspace = true

[dev-dependencies]
ed25519-dalek = "2"
wellfed-testkit.workspace = true
proptest.workspace = true
sha2 = "0.10"
simple-dns = "0.12.0"

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
wellfed-session.workspace = true
sha2 = { version = "0.10", default-features = false }

# On the feeder, the compact SHA-2 rounds: the unrolled SHA-512 alone was
# 21.8 KB of a firmware image, for a hash that only checks update
# signatures. Host builds keep the unrolled rounds.
[target.'cfg(target_os = "none")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }

[lints]
workspace = true
