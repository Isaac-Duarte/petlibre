[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
wellfed-amebad = { path = "crates/wellfed-amebad" }
wellfed-amebad-common = { path = "crates/wellfed-amebad-common" }
wellfed-amebad-sdk = { path = "crates/wellfed-amebad-sdk" }
wellfed-core = { path = "crates/wellfed-core" }
wellfed-firstboot = { path = "crates/wellfed-firstboot" }
wellfed-formats = { path = "crates/wellfed-formats" }
wellfed-testkit = { path = "crates/wellfed-testkit" }
# Host tools.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = "1.28.0"
# Firmware targets.
cortex-m = "0.7.7"

# Every crate inherits these, tests included. Host crates also forbid
# `unsafe` at their crate roots; firmware crates permit audited `unsafe` at
# the C ABI and MMIO boundaries only, each block with a SAFETY comment. The
# production-only lints (no unwrap, no narrowing `as`, …) run from
# `make check-rust` over libraries and binaries, so tests stay free to unwrap.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

# Firmware staticlibs: size-optimized, one LTO object per core so the linker
# script can retain the RAM park section; unwinding is never generated.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
