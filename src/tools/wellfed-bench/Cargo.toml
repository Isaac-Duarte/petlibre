[package]
license.workspace = true
name = "wellfed-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Relay bench for the PLAF103 research unit: the command line over the rig's sequences and the integration suite, and the read-only progress page beside them"
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
wellfed-dashboard = { path = "../wellfed-dashboard", optional = true }
wellfed-formats.workspace = true
wellfed-itest = { path = "../wellfed-itest" }
wellfed-relay = { path = "../wellfed-relay" }
wellfed-rig = { path = "../wellfed-rig" }
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# The read-only page (`--ui`), served by wellfed-dashboard. Build
# src/web/apps/bench/dist first (`make ui`); the page embeds it.
ui = ["dep:wellfed-dashboard", "wellfed-dashboard/ui"]

[lints]
workspace = true
