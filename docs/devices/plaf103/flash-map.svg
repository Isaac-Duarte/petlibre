<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="flash-map-title flash-map-desc">
  <title id="flash-map-title">The PLAF103's 8 MiB flash, to scale</title>
  <desc id="flash-map-desc">A bar from offset 0 to 8 MiB. The boot material takes the first 24 KiB. Bank 0 runs from 0x006000 to 0x186000 and bank 1 from 0x186000. Wellfed's storage is a thin slice at 0x340000. Stock's settings and clock sit just below 4 MiB, and its logs, plans and feed records near the end. Everything else is not mapped, which does not make it free.</desc>

  <!-- Offsets: 80 px per MiB from x = 40 -->
  <g class="d-mono">
    <text x="40" y="44" text-anchor="middle">0</text>
    <text x="200" y="44" text-anchor="middle">2 MiB</text>
    <text x="360" y="44" text-anchor="middle">4 MiB</text>
    <text x="520" y="44" text-anchor="middle">6 MiB</text>
    <text x="680" y="44" text-anchor="middle">8 MiB</text>
  </g>
  <g class="d-wire">
    <line x1="40" y1="52" x2="40" y2="60"/><line x1="200" y1="52" x2="200" y2="60"/><line x1="360" y1="52" x2="360" y2="60"/><line x1="520" y1="52" x2="520" y2="60"/><line x1="680" y1="52" x2="680" y2="60"/>
  </g>

  <!-- The bar -->
  <rect class="d-unknown" x="40" y="64" width="640" height="72"/>
  <rect class="d-warn" x="40" y="64" width="3" height="72"/>
  <rect class="d-accent" x="43" y="64" width="119" height="72"/>
  <rect class="d-accent" x="162" y="64" width="105" height="72"/>
  <rect class="d-ok" x="300" y="64" width="15" height="72"/>
  <rect class="d-box" x="352.5" y="64" width="8" height="72"/>
  <rect class="d-box" x="663.4" y="64" width="5" height="72"/>

  <text x="102" y="96" text-anchor="middle" class="d-title">Bank 0</text>
  <text x="102" y="116" text-anchor="middle" class="d-muted">1.5 MiB</text>
  <text x="214" y="96" text-anchor="middle" class="d-title">Bank 1</text>
  <text x="214" y="116" text-anchor="middle" class="d-muted">1.3 MiB</text>
  <text x="512" y="96" text-anchor="middle" class="d-muted">Not mapped.</text>
  <text x="512" y="114" text-anchor="middle" class="d-muted">Unknown is not free.</text>

  <!-- Callouts for the thin slices -->
  <g class="d-wire">
    <line x1="41.5" y1="140" x2="41.5" y2="168"/>
    <line x1="307.5" y1="140" x2="307.5" y2="214"/>
    <line x1="356.5" y1="140" x2="356.5" y2="262"/>
    <line x1="666" y1="140" x2="666" y2="168"/>
  </g>
  <text x="36" y="186" class="d-title">Boot material</text>
  <text x="36" y="204" class="d-mono">0x000000, 24 KiB</text>
  <text x="312" y="232" text-anchor="end" class="d-title">Wellfed storage</text>
  <text x="312" y="250" text-anchor="end" class="d-mono">0x340000, 48 sectors</text>
  <text x="350" y="280" class="d-title">Stock settings and clock</text>
  <text x="350" y="298" class="d-mono">0x3e8000</text>
  <text x="684" y="186" text-anchor="end" class="d-title">Stock logs, plans, feed records</text>
  <text x="684" y="204" text-anchor="end" class="d-mono">0x7cb000</text>

  <!-- Key -->
  <rect class="d-accent" x="40" y="330" width="14" height="14"/>
  <text x="60" y="342" class="d-muted">firmware bank</text>
  <rect class="d-ok" x="160" y="330" width="14" height="14"/>
  <text x="180" y="342" class="d-muted">Wellfed's data</text>
  <rect class="d-box" x="282" y="330" width="14" height="14"/>
  <text x="302" y="342" class="d-muted">stock's data</text>
  <rect class="d-warn" x="394" y="330" width="14" height="14"/>
  <text x="414" y="342" class="d-muted">preserve</text>
  <rect class="d-unknown" x="486" y="330" width="14" height="14"/>
  <text x="506" y="342" class="d-muted">not mapped</text>
</svg>
