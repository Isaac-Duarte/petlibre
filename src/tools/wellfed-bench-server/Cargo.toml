[package]
license.workspace = true
name = "wellfed-bench-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The bench as one foreground server: it holds the bench lease and the relay board, runs the rig's sequences and the integration suite one job at a time, and answers its clients on a private unix socket"
publish.workspace = true

[dependencies]
axum.workspace = true
bytes = "1"
clap.workspace = true
futures-util = { workspace = true, default-features = false }
http-body-util.workspace = true
# The clients' side of the socket: hyper's client over a unix stream.
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustix = { version = "1", features = ["fs", "process", "stdio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wellfed-formats.workspace = true
wellfed-itest = { path = "../wellfed-itest" }
wellfed-relay = { path = "../wellfed-relay" }
wellfed-rig = { path = "../wellfed-rig" }

[dev-dependencies]
tempfile.workspace = true
wellfed-relay = { path = "../wellfed-relay", features = ["fake"] }

[lints]
workspace = true
