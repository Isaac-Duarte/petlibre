[package]
license.workspace = true
name = "wellfed-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local AmebaD firmware builds: pinned SDK and toolchain, source-bound identity, SDK overlays and the linked-image audits"
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap.workspace = true
wellfed-flash = { version = "0.1.0", path = "../wellfed-flash" }
regex = "1"
rustix = { version = "1", features = ["process", "fs"] }
serde_json.workspace = true
sha2 = "0.11"
tempfile.workspace = true
