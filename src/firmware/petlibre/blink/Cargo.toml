[package]
license.workspace = true
name = "petlibre-fw-blink"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental minimal PLAF103 firmware on the PetLibre SDK: blinks the connection indicator"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-sdk/km4"]

[dependencies]
petlibre-sdk.workspace = true

[lints]
workspace = true

# What petlibre-build reads (see the reference firmware): blink builds for
# the PLAF103, with no startup policies of its own and no variants.
[package.metadata.petlibre]
devices = ["plaf103"]
