[package]
license.workspace = true
name = "wellfed-fw-buttons"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 bring-up firmware on the Wellfed SDK: the FW20 panel-button probe, read-only"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4", "wellfed-probes/km4"]

[dependencies]
wellfed-sdk.workspace = true
wellfed-probes.workspace = true

[lints]
workspace = true

# What wellfed-build reads: no startup policies (the button probe has none).
[package.metadata.wellfed]
devices = ["plaf103"]
