[package]
license.workspace = true
name = "wellfed-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Relay bench for the PLAF103 research unit: feeder power, loader strap, chained wellfed-flash sessions and a read-only progress page"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap.workspace = true
ctrlc.workspace = true
wellfed-core.workspace = true
futures-util = { version = "0.3", default-features = false, optional = true }
rust-embed = { version = "8.13.0", features = ["debug-embed"], optional = true }
rustix = { version = "1", features = ["fs", "process"] }
wellfed-formats.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }

[features]
# The web page (`--ui`). Build src/web/apps/bench/dist first (`make ui`); the
# server embeds it at compile time.
ui = ["dep:axum", "dep:futures-util", "dep:rust-embed", "dep:tokio"]

[lints]
workspace = true
