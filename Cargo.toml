[workspace]
members = [
    "src/sdk/*",
    "src/product/*",
    "src/client/*",
    "src/server/*",
    "src/tools/wellfed",
    "src/tools/wellfed-*",
    "src/tools/xtask",
    "src/firmware/wellfed/*", "src/client/wellfed-client",
    "src/firmware/bench/wellfed-bench-at",
]
# The cargo-fuzz targets build on nightly-only sanitizer flags, so they keep
# their own workspace and lockfile (`cargo xtask fuzz`). The bench board's
# RP2040 firmware builds only for its target (`make check-bench-board`).
exclude = ["src/fuzz", "src/firmware/bench/wellfed-bench-board"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
wellfed-hal = { path = "src/sdk/wellfed-hal" }
wellfed-hal-common = { path = "src/sdk/wellfed-hal-common" }
wellfed-amebad-sys = { path = "src/sdk/wellfed-amebad-sys" }
wellfed-board-plaf103 = { path = "src/sdk/wellfed-board-plaf103" }
wellfed-core = { path = "src/sdk/wellfed-core" }
wellfed-proto = { path = "src/product/wellfed-proto" }
wellfed-session = { path = "src/sdk/wellfed-session" }
wellfed-probes = { path = "src/sdk/wellfed-probes" }
wellfed-sdk = { path = "src/sdk/wellfed-sdk" }
wellfed-sdk-macros = { path = "src/sdk/wellfed-sdk-macros" }
wellfed-device-api = { path = "src/product/wellfed-device-api" }
wellfed-feeder = { path = "src/product/wellfed-feeder" }
wellfed-feeder-runtime = { path = "src/product/wellfed-feeder-runtime" }
wellfed-client = { path = "src/client/wellfed-client" }
wellfed-model = { path = "src/client/wellfed-model" }
wellfed-connect = { path = "src/client/wellfed-connect" }
wellfed-feeder-sim = { path = "src/tools/wellfed-feeder-sim" }
wellfed-api = { path = "src/server/wellfed-api" }
wellfed-store = { path = "src/server/wellfed-store" }
wellfed-mirror = { path = "src/server/wellfed-mirror" }
wellfed-releases = { path = "src/server/wellfed-releases" }
wellfed-service = { path = "src/server/wellfed-service" }
wellfed-server = { path = "src/server/wellfed-server" }
wellfed-server-client = { path = "src/client/wellfed-server-client" }
wellfed-server-testkit = { path = "src/server/wellfed-server-testkit" }
wellfed-formats = { path = "src/tools/wellfed-formats" }
wellfed-stock = { path = "src/tools/wellfed-stock" }
wellfed-stock-api = { path = "src/tools/wellfed-stock-api" }
wellfed-emu = { path = "src/tools/wellfed-emu" }
wellfed-image = { path = "src/tools/wellfed-image" }
wellfed-signing = { path = "src/tools/wellfed-signing" }
wellfed-testkit = { path = "src/sdk/wellfed-testkit" }
wellfed-sim = { path = "src/sdk/wellfed-sim" }
# Host tools.
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
# Bounded property tests of the network parsers (dev-dependency only). No
# fork or timeout features: properties run in-process under nextest.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tokio = "1.53.3"
uuid = "1.28.0"
# The owner's server (src/server). Every server dependency is pinned here, so
# its crates cannot drift apart on a shared one.
argon2 = "0.5.3"
# Signing update manifests in the server's tests, as the firmware checks
# them: ed25519-dalek 2 hashes with sha2 0.10, a version behind the
# server's own, so that one is named apart.
ed25519-dalek = "2"
sha2-0-10 = { package = "sha2", version = "0.10" }
axum-extra = "0.12.6"
chacha20poly1305 = { version = "0.10.1", default-features = false }
futures-util = "0.3.34"
getrandom = "0.3.4"
http-body-util = "0.1.5"
jiff = "0.2.38"
jiff-tzdb = "0.1.9"
reqwest = { version = "0.13.5", default-features = false }
serde_path_to_error = "0.1.20"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
# Firmware targets.
cortex-m = "0.7.7"

# Every crate inherits these, tests included. Host crates also forbid
# `unsafe` at their crate roots; firmware crates permit audited `unsafe` at
# the C ABI and MMIO boundaries only, each block with a SAFETY comment. The
# production-only lints (no unwrap, no narrowing `as`, …) run from
# `make check-rust` over libraries and binaries, so tests stay free to unwrap.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

# Firmware staticlibs: size-optimized, one LTO object per core so the linker
# script can retain the RAM park section; unwinding is never generated.
[profile.firmware]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = true
panic = "abort"
