[package]
license.workspace = true
name = "wellfed-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The owner's server domain logic: users, feeder connections and event sync. No HTTP, no SQL"
publish.workspace = true

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
jiff.workspace = true
wellfed-api.workspace = true
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-core.workspace = true
wellfed-proto.workspace = true
wellfed-store.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
wellfed-feeder-sim = { workspace = true, features = ["harness"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
