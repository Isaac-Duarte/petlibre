[package]
license.workspace = true
name = "petlibre-proto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The device protocol's messages, shared by the feeder and its clients: no IO, no crypto, no allocation"
publish.workspace = true

# Not the workspace's serde and thiserror: those enable `std`, and the
# firmware builds this crate for a bare-metal target.
[dependencies]
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }

[lints]
workspace = true
