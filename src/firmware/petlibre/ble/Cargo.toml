[package]
license.workspace = true
name = "petlibre-fw-ble"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 firmware on the PetLibre SDK: Bluetooth LE bring-up and Wi-Fi setup over BLE"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings and the BLE peripheral's calls.
km4 = ["petlibre-sdk/km4", "petlibre-sdk/bluetooth", "petlibre-probes/km4", "petlibre-probes/bluetooth"]

[dependencies]
petlibre-sdk.workspace = true
petlibre-probes.workspace = true

[lints]
workspace = true

# What petlibre-build reads (see the README): it builds for the
# PLAF103 and links the device's Bluetooth stack (FW34), with no startup
# policies of its own and no variants.
[package.metadata.petlibre]
devices = ["plaf103"]
bluetooth = true
