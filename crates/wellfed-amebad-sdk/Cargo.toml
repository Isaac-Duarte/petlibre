[package]
license.workspace = true
name = "wellfed-amebad-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Pinned AmebaD SDK calls for the PLAF103 ports, with a deterministic host fake"
publish.workspace = true
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
# Requires WELLFED_SDK_DIR and WELLFED_NEWLIB_INCLUDE; set by wellfed-build.
sdk = ["dep:bindgen"]
# Select the core; only KM4 calls the SDK.
km0 = []
km4 = []

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true

[build-dependencies]
bindgen = { version = "0.72.1", optional = true, default-features = false, features = ["runtime"] }

# The workspace lints, plus a SAFETY comment on every `unsafe` block: Cargo
# cannot extend `workspace = true`, and the host crates do not opt in yet.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
