[package]
license.workspace = true
name = "wellfed-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "C ABI for linking the Rust replacement firmware into the AmebaD SDK"
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Link the AmebaD ports for one core (target builds from wellfed-build).
km0 = ["dep:wellfed-amebad-common", "wellfed-amebad-common/km0"]
km4 = ["dep:wellfed-amebad", "dep:wellfed-firstboot", "wellfed-firstboot/km4"]
fw16-pulse = ["km4", "wellfed-firstboot/fw16-pulse"]
fw11-reset = ["km4", "wellfed-firstboot/fw11-reset"]
fw11-fail = ["km4", "wellfed-firstboot/fw11-fail"]
speaker = ["km4", "wellfed-firstboot/speaker"]

[dependencies]
wellfed-core.workspace = true
wellfed-amebad = { workspace = true, optional = true }
wellfed-amebad-common = { workspace = true, optional = true }
wellfed-firstboot = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
wellfed-testkit.workspace = true
