[package]
license.workspace = true
name = "wellfed-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The owner's server: mirrors each feeder's history and serves the HTTP API"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros"] }
axum-extra = { workspace = true, features = ["cookie", "with-rejection"] }
clap = { workspace = true, features = ["env"] }
futures-util.workspace = true
jiff.workspace = true
wellfed-api.workspace = true
wellfed-service.workspace = true
wellfed-store.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tower-http = { workspace = true, features = ["limit", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
wellfed-server-client.workspace = true
wellfed-server-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
