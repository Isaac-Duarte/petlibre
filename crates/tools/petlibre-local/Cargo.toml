[package]
name = "petlibre-local"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Local stock-firmware control for an owned Petlibro PLAF103"
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap.workspace = true
rumqttc = { version = "0.25.1", default-features = false }
mqtt5 = { version = "0.48.1", default-features = false, features = ["broker"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
petlibre-core.workspace = true
petlibre-formats.workspace = true
ed25519-dalek = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
