[package]
license = "MIT"
name = "petlibre-amebad"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Experimental PLAF103 AmebaD board, supervision, owner and flash-park ports"
publish = false
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
sdk = ["petlibre-amebad-sdk/sdk"]
# Select the core whose MMIO map and semaphore owner encoding apply.
km0 = ["petlibre-amebad-sdk/km0"]
km4 = ["petlibre-amebad-sdk/km4"]

[dependencies]
petlibre-amebad-sdk = { path = "../amebad-sdk" }
petlibre-core = { path = "../core" }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7.7"

[dev-dependencies]
petlibre-testkit = { path = "../testkit" }

[lints]
workspace = true
