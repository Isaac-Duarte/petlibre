[package]
license.workspace = true
name = "petlibre-fw-feeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 product firmware on the PetLibre SDK: the panel and its child lock (FP11) so far"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-sdk/km4"]

[dependencies]
petlibre-sdk.workspace = true
petlibre-feeder.workspace = true

[lints]
workspace = true

# What petlibre-build reads: no startup policies (nothing here moves the
# motor or runs the emitters).
[package.metadata.petlibre]
devices = ["plaf103"]
