[package]
license.workspace = true
name = "wellfed-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The owner's server domain logic: users, feeder connections and event sync. No HTTP, no SQL"
publish.workspace = true

[dependencies]
argon2 = { workspace = true, features = ["std"] }
chacha20poly1305 = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
jiff.workspace = true
wellfed-api.workspace = true
wellfed-client.workspace = true
wellfed-connect.workspace = true
wellfed-model.workspace = true
wellfed-proto.workspace = true
wellfed-session.workspace = true
wellfed-store.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
wellfed-feeder-sim = { workspace = true, features = ["harness"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
