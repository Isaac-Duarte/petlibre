[package]
license.workspace = true
name = "wellfed-hal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 AmebaD KM4 ports: board, supervision, owner, transport and updater"
publish.workspace = true
build = "build.rs"

[features]
# Generate SDK bindings from the pinned AmebaD headers (target builds only).
sdk = ["wellfed-amebad-sys/sdk"]
# KM4 target builds; the KM0 image links only wellfed-hal-common.
km4 = ["wellfed-hal-common/km4", "wellfed-amebad-sys/km4"]
# BLE setup; needs a Bluetooth firmware's image.
bluetooth = ["wellfed-amebad-sys/bluetooth"]
# Motor STOP writes that do not take while a hold is armed (`inject`).
# Only the feeder's `stop-fail` bench variant sets it.
stop-fail = []

[dependencies]
wellfed-hal-common.workspace = true
wellfed-amebad-sys.workspace = true
wellfed-board-plaf103.workspace = true
wellfed-core.workspace = true
wellfed-session.workspace = true
# Bank 0's image is hashed before a give-way; the rounds are core's.
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
ed25519-dalek = "2"
wellfed-testkit.workspace = true
sha2 = "0.10"

[lints]
workspace = true

# The injected failed stop, over the owner; `make check-rust` runs it with
# the feature.
[[test]]
name = "inject"
required-features = ["stop-fail"]
