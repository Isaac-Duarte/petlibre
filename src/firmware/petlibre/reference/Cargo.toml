[package]
license.workspace = true
name = "petlibre-fw-reference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 reference firmware on the PetLibre SDK: the bench probes and the diagnostic image's optional tasks"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-sdk/km4", "petlibre-hal/km4", "petlibre-hal/sdk"]
# The image variants declared below. Only `petlibre-build --variant <name>`
# sets one; none is ever a default.
fw16-pulse = []
fw14-adc = []
fw11-reset = []
fw11-fail = ["petlibre-sdk/fw11-fail"]
speaker = []

[dependencies]
petlibre-sdk.workspace = true
petlibre-hal.workspace = true
petlibre-core.workspace = true

[lints]
workspace = true

# What petlibre-build reads: the devices this firmware builds for, the
# startup policies its normal first-boot image carries (the startup audit
# checks each against the image's markers), and its opt-in image variants.
# A variant is the Cargo feature of the same name; its policies replace the
# normal image's.
[package.metadata.petlibre]
devices = ["plaf103"]
policies = { optics = "fw13-optics-v2" }

[package.metadata.petlibre.variants.fw16-pulse]
summary = "FW16: the first supervised motor pulse, once per cold boot, instead of the FW13 optics probe"
policies = { motion = "fw16-pulse-v1" }

[package.metadata.petlibre.variants.fw14-adc]
summary = "FW14: samples the power inputs read-only, once a second, instead of the FW13 optics probe"
policies = { adc = "fw14-adc-v2" }

[package.metadata.petlibre.variants.fw11-reset]
summary = "FW11 trial test: stops feeding the watchdog right after startup, before it could confirm"
policies = { trial = "fw11-reset-v1" }

[package.metadata.petlibre.variants.fw11-fail]
summary = "FW11 trial test: startup fails on a determined error"
policies = { trial = "fw11-fail-v1" }

[package.metadata.petlibre.variants.speaker]
summary = "The normal image plus a signed network audio stream (petlibre-hal stream.rs)"
