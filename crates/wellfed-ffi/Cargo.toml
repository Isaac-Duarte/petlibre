[package]
license.workspace = true
name = "wellfed-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "C ABI for linking the Rust replacement firmware into the AmebaD SDK"
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Link the AmebaD ports for one core (target builds from firmware/tools/build.py).
km0 = ["dep:wellfed-amebad", "wellfed-amebad/km0"]
km4 = ["dep:wellfed-amebad", "wellfed-amebad/km4", "wellfed-amebad/sdk"]
fw16-pulse = ["km4", "wellfed-amebad/fw16-pulse"]
fw11-reset = ["km4", "wellfed-amebad/fw11-reset"]

[dependencies]
wellfed-core.workspace = true
wellfed-amebad = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
wellfed-testkit.workspace = true
