<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="parts-title parts-desc">
  <title id="parts-title">What the PLAF103's parts connect to</title>
  <desc id="parts-desc">The RTL8721DM chip sits in the middle. It reads the optical sensors, the buttons and the power inputs. It drives the motor driver, the lights and the sound. Flash and the console connect below it.</desc>
  <defs>
    <marker id="parts-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head-accent" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="parts-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="d-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- What the chip reads -->
  <text x="20" y="22" class="d-muted">THE CHIP READS</text>
  <rect class="d-box" x="20" y="34" width="190" height="108" rx="10"/>
  <text x="36" y="58" class="d-title">Optical sensors</text>
  <text x="36" y="80" class="d-muted">Food level</text><text x="194" y="80" text-anchor="end" class="d-mono">PA17</text>
  <text x="36" y="98" class="d-muted">Outlet</text><text x="194" y="98" text-anchor="end" class="d-mono">PA16</text>
  <text x="36" y="116" class="d-muted">Portion feedback</text><text x="194" y="116" text-anchor="end" class="d-mono">PA18</text>
  <text x="36" y="134" class="d-muted">Emitters (driven)</text><text x="194" y="134" text-anchor="end" class="d-mono">PA15 PB3</text>

  <rect class="d-box" x="20" y="162" width="190" height="72" rx="10"/>
  <text x="36" y="186" class="d-title">Buttons</text>
  <text x="36" y="206" class="d-muted">Lock, Dispense, Mic, Reset</text>
  <text x="36" y="224" class="d-mono">PB4–PB7</text>

  <rect class="d-box" x="20" y="254" width="190" height="90" rx="10"/>
  <text x="36" y="278" class="d-title">Power</text>
  <text x="36" y="298" class="d-muted">Adapter present</text><text x="194" y="298" text-anchor="end" class="d-mono">PA19</text>
  <text x="36" y="316" class="d-muted">Battery voltage</text><text x="194" y="316" text-anchor="end" class="d-mono">PB2 ADC</text>
  <text x="36" y="334" class="d-muted">Motor current</text><text x="194" y="334" text-anchor="end" class="d-mono">PB1 ADC</text>

  <path class="d-wire-accent" d="M210,88 C240,88 240,196 266,196" marker-end="url(#parts-in)"/>
  <path class="d-wire-accent" d="M210,198 L266,226" marker-end="url(#parts-in)"/>
  <path class="d-wire-accent" d="M210,299 C240,299 240,256 266,256" marker-end="url(#parts-in)"/>

  <!-- The chip -->
  <rect class="d-accent" x="270" y="170" width="180" height="120" rx="12"/>
  <text x="360" y="208" text-anchor="middle" class="d-title">RTL8721DM</text>
  <text x="360" y="228" text-anchor="middle" class="d-muted">Wi-Fi + Bluetooth LE chip</text>
  <text x="360" y="254" text-anchor="middle" class="d-muted">Cores: KM4 and KM0</text>
  <text x="360" y="272" text-anchor="middle" class="d-muted">Runs Wellfed</text>

  <!-- What the chip drives -->
  <text x="700" y="22" text-anchor="end" class="d-muted">THE CHIP DRIVES</text>
  <rect class="d-box" x="510" y="34" width="190" height="108" rx="10"/>
  <text x="526" y="58" class="d-title">Motor</text>
  <text x="526" y="80" class="d-muted">through a TC118AH</text>
  <text x="526" y="98" class="d-muted">H-bridge driver</text>
  <text x="526" y="116" class="d-muted">Both pins high: brake</text>
  <text x="526" y="134" class="d-mono">PA13 PA14</text>

  <rect class="d-box" x="510" y="162" width="190" height="72" rx="10"/>
  <text x="526" y="186" class="d-title">Lights</text>
  <text x="526" y="206" class="d-muted">Four indicator lights</text>
  <text x="526" y="224" class="d-mono">PA2 PA4 PA0 PB22</text>

  <rect class="d-box" x="510" y="254" width="190" height="90" rx="10"/>
  <text x="526" y="278" class="d-title">Sound</text>
  <text x="526" y="298" class="d-muted">Speaker amplifier</text><text x="684" y="298" text-anchor="end" class="d-mono">PB23</text>
  <text x="526" y="316" class="d-muted">Buzzer</text><text x="684" y="316" text-anchor="end" class="d-mono">PA25</text>
  <text x="526" y="334" class="d-muted">Audio from the codec</text>

  <path class="d-wire" d="M450,196 C480,196 480,88 506,88" marker-end="url(#parts-out)"/>
  <path class="d-wire" d="M450,226 L506,198" marker-end="url(#parts-out)"/>
  <path class="d-wire" d="M450,256 C480,256 480,299 506,299" marker-end="url(#parts-out)"/>

  <!-- Memory and console -->
  <rect class="d-box" x="190" y="384" width="160" height="72" rx="10"/>
  <text x="206" y="408" class="d-title">Flash</text>
  <text x="206" y="428" class="d-muted">8 MiB, keeps its data</text>
  <text x="206" y="446" class="d-muted">with the power off</text>
  <path class="d-wire" d="M320,294 L320,380" marker-start="url(#parts-out)" marker-end="url(#parts-out)"/>
  <text x="328" y="342" class="d-mono">SPI</text>

  <rect class="d-box" x="370" y="384" width="160" height="72" rx="10"/>
  <text x="386" y="408" class="d-title">Console</text>
  <text x="386" y="428" class="d-muted">UART on CON5,</text>
  <text x="386" y="446" class="d-muted">for recovery</text>
  <path class="d-wire" d="M400,294 L400,380" marker-start="url(#parts-out)" marker-end="url(#parts-out)"/>
  <text x="408" y="342" class="d-mono">UART</text>

  <!-- Key -->
  <line class="d-wire-accent" x1="20" y1="484" x2="52" y2="484"/>
  <text x="60" y="488" class="d-muted">a signal the chip reads</text>
  <line class="d-wire" x1="230" y1="484" x2="262" y2="484"/>
  <text x="270" y="488" class="d-muted">a signal the chip drives</text>
  <text x="700" y="488" text-anchor="end" class="d-muted">PA13 = port A, pin 13</text>
</svg>
