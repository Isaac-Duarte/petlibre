[package]
license.workspace = true
name = "wellfed-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The device API's session layer: Noise handshakes, HMAC, the setup code, length-prefixed frames, and the hex and base64 text forms"
publish.workspace = true

[dev-dependencies]
proptest.workspace = true
snow = "0.10"

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }

# On the feeder, the compact SHA-2 rounds, as wellfed-core takes them: one
# sha2 build serves both crates, and the unrolled SHA-512 alone was 21.8 KB
# of a firmware image. Host builds keep the unrolled rounds.
[target.'cfg(target_os = "none")'.dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft-compact"] }

[lints]
workspace = true
