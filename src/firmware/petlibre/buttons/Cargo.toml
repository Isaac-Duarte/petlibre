[package]
license.workspace = true
name = "petlibre-fw-buttons"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 bring-up firmware on the PetLibre SDK: the panel-button probe and the SDK button service"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-sdk/km4", "petlibre-probes/km4"]

[dependencies]
petlibre-sdk.workspace = true
petlibre-probes.workspace = true

[lints]
workspace = true

# What petlibre-build reads: no startup policies (the button probe has none).
[package.metadata.petlibre]
devices = ["plaf103"]
