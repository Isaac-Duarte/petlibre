[package]
license.workspace = true
name = "petlibre-fw-reference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 reference firmware on the PetLibre SDK: the bench probes and the diagnostic image's optional tasks"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-sdk/km4", "petlibre-hal/km4", "petlibre-hal/sdk"]
# FW16 first supervised motor pulse instead of the FW13 optics probe. Only
# `petlibre-build plaf103-firstboot --motion-probe` sets it; never a default.
fw16-pulse = []
# FW11 trial test: a candidate that stops feeding the watchdog right after
# startup, before it could confirm. Only `petlibre-build plaf103-firstboot --trial-reset` sets it.
fw11-reset = []
# FW11 trial test: a candidate whose startup fails on a determined error.
# Only `petlibre-build plaf103-firstboot --trial-fail` sets it.
fw11-fail = ["petlibre-sdk/fw11-fail"]
# Speaker variant: the normal image plus a signed network audio stream
# (petlibre-hal stream.rs). Only `petlibre-build plaf103-firstboot --speaker` sets it.
speaker = []

[dependencies]
petlibre-sdk.workspace = true
petlibre-hal.workspace = true
petlibre-core.workspace = true

[lints]
workspace = true
