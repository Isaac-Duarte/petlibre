[package]
license.workspace = true
name = "wellfed-fw-reference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 reference firmware on the Wellfed SDK: the bench probes and the diagnostic image's optional tasks"
publish.workspace = true

# The KM4 archive wellfed-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["wellfed-sdk/km4", "wellfed-hal/km4", "wellfed-hal/sdk"]
# FW16 first supervised motor pulse instead of the FW13 optics probe. Only
# `wellfed-build plaf103-firstboot --motion-probe` sets it; never a default.
fw16-pulse = []
# FW11 trial test: a candidate that stops feeding the watchdog right after
# startup, before it could confirm. Only `wellfed-build plaf103-firstboot --trial-reset` sets it.
fw11-reset = []
# FW11 trial test: a candidate whose startup fails on a determined error.
# Only `wellfed-build plaf103-firstboot --trial-fail` sets it.
fw11-fail = ["wellfed-sdk/fw11-fail"]
# Speaker variant: the normal image plus a signed network audio stream
# (wellfed-hal stream.rs). Only `wellfed-build plaf103-firstboot --speaker` sets it.
speaker = []

[dependencies]
wellfed-sdk.workspace = true
wellfed-hal.workspace = true
wellfed-core.workspace = true

[lints]
workspace = true
