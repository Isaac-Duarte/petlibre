[package]
license.workspace = true
name = "wellfed-feeder-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A simulated feeder serving the real device API over TCP, on the feeder's own policy and stores"
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
wellfed-amebad-sys.workspace = true
wellfed-client.workspace = true
wellfed-core.workspace = true
wellfed-feeder.workspace = true
wellfed-formats.workspace = true
wellfed-proto.workspace = true
wellfed-session.workspace = true
socket2 = "0.6.5"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }

[features]
# The test harness other crates' tests start simulators with; never built
# into the binary.
harness = []

[dev-dependencies]
wellfed-feeder-sim = { path = ".", features = ["harness"] }
wellfed-connect.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
