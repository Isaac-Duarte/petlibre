[package]
license.workspace = true
name = "petlibre-fw-motor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 bring-up firmware on the PetLibre SDK: the FW16 supervised motor pulse, behind its variant"
publish.workspace = true

# The KM4 archive petlibre-build links into the image.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# KM4 target builds with the pinned SDK bindings.
km4 = ["petlibre-sdk/km4", "petlibre-probes/km4"]
# The variant declared below; only `petlibre-build --variant` sets it.
fw16-pulse = []

[dependencies]
petlibre-sdk.workspace = true
petlibre-probes.workspace = true

[lints]
workspace = true

# What petlibre-build reads. The pulse is a variant, never the normal image:
# variants apply to first-boot builds only, which always carry their motion
# policy in the manifest, so the bench's attended-motion gate sees every
# image that can drive the motor.
[package.metadata.petlibre]
devices = ["plaf103"]

[package.metadata.petlibre.variants.fw16-pulse]
summary = "FW16: the first supervised motor pulse, once per cold boot"
policies = { motion = "fw16-pulse-v1" }
