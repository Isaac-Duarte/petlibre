[package]
license.workspace = true
name = "wellfed-amebad-common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Experimental PLAF103 AmebaD routines both cores link: flash park, SDK flash hooks, the KM0 park peer and the OTA trial step"
publish.workspace = true
build = "build.rs"

[features]
# Select the core whose exported routines and MMIO owner encoding apply.
km0 = ["wellfed-amebad-sdk/km0"]
km4 = ["wellfed-amebad-sdk/km4"]

[dependencies]
wellfed-amebad-sdk.workspace = true
wellfed-core.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true

# The workspace lints, plus a SAFETY comment on every `unsafe` block: Cargo
# cannot extend `workspace = true`, and the host crates do not opt in yet.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
